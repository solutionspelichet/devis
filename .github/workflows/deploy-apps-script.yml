name: Deploy Apps Script backend

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'
      - 'ci/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Write clasp credentials
        run: echo "$CLASP_CREDENTIALS" > "$HOME/.clasprc.json"
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}

      - name: Push code to Apps Script
        run: clasp push --force

      - name: Deploy (production)
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOYMENT_ID: ${{ vars.PROD_DEPLOYMENT_ID }}
        run: |
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "::error::Variable de repo PROD_DEPLOYMENT_ID absente — configure-la dans Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          clasp deploy -i "$DEPLOYMENT_ID" -d "prod $(date -u +%Y-%m-%dT%H:%M:%SZ) ${{ github.sha }}"

      - name: Deploy (test)
        if: github.ref != 'refs/heads/main'
        env:
          DEPLOYMENT_ID: ${{ vars.TEST_DEPLOYMENT_ID }}
        run: |
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "::warning::Variable de repo TEST_DEPLOYMENT_ID absente — le code a ete pousse (clasp push) mais aucun deploiement de test n'a ete mis a jour. Cree un deploiement de test (clasp deploy -d 'test') puis ajoute son ID comme variable de repo TEST_DEPLOYMENT_ID."
            exit 0
          fi
          clasp deploy -i "$DEPLOYMENT_ID" -d "test ${{ github.ref_name }} $(date -u +%Y-%m-%dT%H:%M:%SZ) ${{ github.sha }}"
